<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Naveen Malothu — animated ASCII developer profile</title><desc id="desc">An ASCII portrait of Naveen beside a terminal showing his engineering role, projects and technology stack. Built from text and SVG vectors, with typing and scan animations.</desc>
<defs><linearGradient id="edge"><stop stop-color="#b6a3ff"/><stop offset="1" stop-color="#81c5e8"/></linearGradient><linearGradient id="scan"><stop stop-color="#81c5e8" stop-opacity="0"/><stop offset=".5" stop-color="#81c5e8" stop-opacity=".14"/><stop offset="1" stop-color="#81c5e8" stop-opacity="0"/></linearGradient><clipPath id="portraitClip"><rect x="22" y="33" width="458" height="489" rx="12"/></clipPath><clipPath id="typeClip"><rect class="type" x="32" y="498" width="490" height="34"/></clipPath></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono,.mono tspan,.ascii{font-family:monospace;white-space:pre}.ascii{font-size:10px}.type{animation:type 8s steps(34,end) infinite}.cursor{animation:blink 1s steps(2,end) infinite}.scan{animation:scan 6s linear infinite}.signal{animation:pulse 3s ease-in-out infinite}
@keyframes type{0%{width:0}30%,90%{width:490px}100%{width:0}}@keyframes blink{50%{opacity:0}}@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(470px)}}@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.type,.cursor,.scan,.signal{animation:none}.scan{opacity:0}}
</style>
