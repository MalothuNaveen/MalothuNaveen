<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title"><title id="title">Engineering approach: clarity, reliability and ownership</title>
<style>.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;white-space:pre}.route{stroke-dasharray:5 8;animation:route 12s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes route{to{stroke-dashoffset:-130}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}</style><rect x="1" y="1" width="1198" height="239" rx="17" fill="#ffffff" stroke="#d4e0dc"/><text x="32" y="43" font-size="12" font-weight="700" fill="#21745d" class="mono" >01</text><text x="32" y="86" font-size="21" font-weight="700" fill="#172a2d" class="sans" >Clarity before complexity</text><text x="32" y="134" font-size="16" font-weight="400" fill="#62797d" class="sans" >Understand the failure modes.</text><text x="32" y="162" font-size="16" font-weight="400" fill="#62797d" class="sans" >Choose the smallest sound design.</text><text x="432" y="43" font-size="12" font-weight="700" fill="#21745d" class="mono" >02</text><text x="432" y="86" font-size="21" font-weight="700" fill="#172a2d" class="sans" >Reliability is a feature</text><text x="432" y="134" font-size="16" font-weight="400" fill="#62797d" class="sans" >Instrument what matters.</text><text x="432" y="162" font-size="16" font-weight="400" fill="#62797d" class="sans" >Make delivery repeatable.</text><text x="832" y="43" font-size="12" font-weight="700" fill="#21745d" class="mono" >03</text><text x="832" y="86" font-size="21" font-weight="700" fill="#172a2d" class="sans" >Ownership end to end</text><text x="832" y="134" font-size="16" font-weight="400" fill="#62797d" class="sans" >Connect product to infrastructure.</text><text x="832" y="162" font-size="16" font-weight="400" fill="#62797d" class="sans" >Build, operate, learn, improve.</text><path d="M400 30V210M800 30V210" stroke="#d4e0dc"/><text x="32" y="211" font-size="10" font-weight="400" fill="#21745d" class="mono" letter-spacing="1">ENGINEERING APPROACH / PRINCIPLES, NOT SHORTCUTS</text></svg>